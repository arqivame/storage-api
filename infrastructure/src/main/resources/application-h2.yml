spring:
  datasource:
    url: ${h2.url}
    username: ${h2.username}
    password: ${h2.password}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: ${h2.console.enabled}
      path: ${h2.console.path}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true

h2:
  username: sa
  password: sa
  url: jdbc:h2:mem:testdb
  console:
    enabled: true
    path: /h2-console
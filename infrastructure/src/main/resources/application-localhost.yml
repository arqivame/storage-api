server:
  port: 8080

spring:
  servlet:
      multipart:
        enabled: false
  security:
    user:
      name: admin
      password: admin
  datasource:
    url: jdbc:postgresql://localhost:5432/storage
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
  cloud:

    function:
      definition: fileUploadSessionCanceledConsumer

    stream:

      function:
        bindings:
          fileUploadSessionCanceledConsumer-in-0: fileUploadSessionCanceledEvent-in-0

      binders:
        rabbitmq-binder:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: localhost
                port: 5672
                username: admin
                password: admin
      default-binder: rabbitmq-binder
      default:
        content-type: application/json

      bindings:

        # Outgoing bindings
        fileUploadSessionCanceledEvent-out-0:
          destination: storage.exchange
        fileUploadSessionCanceledEventError-out-0:
          destination: storage.exchange.error
          producer:
            requiredGroups: storage.file:upload-session.canceled.queue.error

        # Incoming bindings
        fileUploadSessionCanceledEvent-in-0:
          destination: storage.exchange
          group: storage.file:upload-session.canceled.queue
          consumer:
            max-attempts: 1
            concurrency: 3

      rabbit:
        bindings:

          # Outgoing RabbitMQ bindings
          fileUploadSessionCanceledEvent-out-0:
            producer:
              exchangeType: topic
              destination: storage.exchange
              routingKeyExpression: "'storage.file:upload-session.canceled'"
          fileUploadSessionCanceledEventError-out-0:
            producer:
              exchangeType: topic
              destination: storage.exchange.error
              routingKeyExpression: "'storage.file:upload-session.canceled'"
              queueNameGroupOnly: true

          # Incoming RabbitMQ bindings
          fileUploadSessionCanceledEvent-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: storage.file:upload-session.canceled
              queueNameGroupOnly: true
              autoBindDlq: true
              deadLetterExchange: storage.exchange.wait
              deadLetterQueueName: storage.file:upload-session.canceled.queue.wait
              dlqDeadLetterExchange: storage.exchange
              dlqDeadLetterRoutingKey: storage.file:upload-session.canceled
              republishToDlq: false
              dlqTtl: 5000






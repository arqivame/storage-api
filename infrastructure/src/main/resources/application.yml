server:
  port: 8080

spring:
  security:
    user:
      name: admin
      password: admin
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
    # console:
    #   enabled: true
    #   path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true